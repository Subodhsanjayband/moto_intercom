name: motocom
description: Offline Rider and Pillion Motorcycle Intercom with YouTube Music Ducking and QR Auto-Join.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # QR code generation for Rider Host
  qr_flutter: ^4.1.0
  # QR code scanner with camera for Pillion Client
  mobile_scanner: ^5.1.1
  # Network details & IP discovery
  network_info_plus: ^5.0.1
  # Permissions (Mic, Camera, Bluetooth, Nearby Wi-Fi)
  permission_handler: ^11.3.1
  # Audio indicators and icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
