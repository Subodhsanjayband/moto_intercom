name: Build MotoCom Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate modern Android v2 embedding scaffolding
        run: |
          mkdir -p /tmp/motocom_backup
          cp -r android/app/src/main/kotlin /tmp/motocom_backup/
          cp android/app/src/main/AndroidManifest.xml /tmp/motocom_backup/

          flutter create --platforms=android --org com.motocom .

          cp -r /tmp/motocom_backup/kotlin/* android/app/src/main/kotlin/
          cp /tmp/motocom_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: motocom-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
